version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - canonicalheader
    - durationcheck
    - errorlint
    - exhaustive
    - fatcontext
    - nilerr
    - noctx
    - reassign
    - gosec
    - modernize
    - copyloopvar
    - iface
    - intrange
    - mirror
    - perfsprint
    - usestdlibvars
    - sloglint
    - errname
    - gocritic
    - misspell
    - nolintlint
    - predeclared
    - unconvert
    - unparam
    - wastedassign
    - whitespace
  settings:
    exhaustive:
      explicit-exhaustive-switch: true
      default-signifies-exhaustive: false
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - common-false-positives

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/strangemattersystems/markfmt
