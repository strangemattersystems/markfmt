version: "3"

vars:
  BINARY: markfmt
  # golangci-lint and benchstat live in tools/go.mod so their dependencies stay
  # out of go.mod.
  GOLANGCI_LINT: go tool -modfile=tools/go.mod golangci-lint
  BENCHSTAT: go tool -modfile=tools/go.mod benchstat
  GORELEASER: go run github.com/goreleaser/goreleaser/v2@v2.17.0
  # Benchmark output, ignored by git.
  BENCH_DIR: .bench

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  build:
    desc: Build the markfmt binary
    cmds:
      - go build -o {{.BINARY}} ./cmd/markfmt

  exec:
    desc: Build and run the markfmt binary (e.g. task exec -- --check README.md)
    cmds:
      - task: build
      - ./{{.BINARY}} {{.CLI_ARGS}}

  test:
    desc: Run the test suite with the race detector and coverage
    cmds:
      - go test -race -cover ./...

  test-short:
    desc: Run the test suite without the race detector and the timing subtests
    cmds:
      - go test -short ./...

  snapshot:
    desc: Rewrite the output and tree snapshots, then review the diff
    env:
      MARKFMT_UPDATE: "1"
    cmds:
      - go test -count=1 -run='^Test(Format|Parse)Snapshot$' ./internal/markdown
      - git diff --stat -- internal/markdown/testdata/snapshot

  fuzz:
    desc: Fuzz one target (e.g. task fuzz PKG=./internal/markdown FUZZ=FuzzParse -- -fuzztime=5m)
    vars:
      PKG: '{{.PKG | default "./internal/markdown"}}'
      FUZZ: '{{.FUZZ | default "FuzzFormat"}}'
    cmds:
      - go test -run='^$' -fuzz='^{{.FUZZ}}$' -fuzztime=30s {{.CLI_ARGS}} {{.PKG}}

  long:
    desc: Run the long tests of time and memory at the input limit, without the race detector
    env:
      MARKFMT_LONG: "1"
    cmds:
      - go test -count=1 -timeout=60m -v -run='^TestParse$/^long$|^TestFormatSource$/^long$|^TestMaxrssBytes$' ./internal/markdown

  bench:
    desc: Run every benchmark 6 times
    cmds:
      - cmd: |
          set -eu -o pipefail
          mkdir -p {{.BENCH_DIR}}
          go test -run='^$' -bench=. -benchmem -count=6 ./... | tee {{.BENCH_DIR}}/bench.txt

  bench-compare:
    desc: >-
      Compare the benchmarks of the working tree with a base
      (e.g. task bench-compare BASE=main PKG=./internal/format)
    vars:
      BASE: '{{.BASE | default "main"}}'
      PKG: '{{.PKG | default "./internal/format"}}'
      BENCHTIME: '{{.BENCHTIME | default "1s"}}'
      RUNS: '{{.RUNS | default 10}}'
    cmds:
      - cmd: |
          set -eu -o pipefail
          out="$PWD/{{.BENCH_DIR}}"
          mkdir -p "$out"
          dir="$(echo '{{.PKG}}' | sed 's|^\./||')"
          base="$(mktemp -d)"
          trap 'rm -rf "$base"' EXIT
          git archive '{{.BASE}}' | tar -x -C "$base"
          # The benchmarks and their frozen inputs come from the working tree on
          # both sides, so a benchmark that the base does not have still
          # compares, and both sides measure the same work.
          for f in $(git ls-files -co --exclude-standard '*bench_test.go'); do
            mkdir -p "$base/$(dirname "$f")"
            cp "$f" "$base/$f"
          done
          # The benchmark inputs come from the working tree as well, so both
          # sides measure the same bytes. A base that cannot format a case the
          # head adds skips that input, and benchstat shows it for the head only.
          for d in internal/markdown/testdata/bench internal/format/testdata/cases; do
            rm -rf "$base/$d"
            mkdir -p "$base/$d"
            cp "$d"/* "$base/$d/"
          done
          go test -c -o "$out/head.test" '{{.PKG}}'
          (cd "$base" && go test -c -o "$out/base.test" '{{.PKG}}')
          : >"$out/base.txt"
          : >"$out/head.txt"
          i=1
          # Alternating the two binaries run by run cancels the drift of the
          # machine: consecutive runs of one binary differ by about 8%,
          # alternating runs by about 1%.
          while [ "$i" -le {{.RUNS}} ]; do
            echo "bench-compare: run $i of {{.RUNS}}"
            (cd "$base/$dir" && "$out/base.test" -test.run='^$' -test.bench=. -test.benchmem -test.benchtime={{.BENCHTIME}}) >>"$out/base.txt"
            (cd "$dir" && "$out/head.test" -test.run='^$' -test.bench=. -test.benchmem -test.benchtime={{.BENCHTIME}}) >>"$out/head.txt"
            i=$((i + 1))
          done
          {{.BENCHSTAT}} "base={{.BENCH_DIR}}/base.txt" "head={{.BENCH_DIR}}/head.txt" | tee "$out/compare.txt"

  profile:
    desc: >-
      Profile one benchmark
      (e.g. task profile PKG=./internal/format BENCH='^BenchmarkSource$/design')
    vars:
      PKG: '{{.PKG | default "./internal/format"}}'
      BENCH: '{{.BENCH | default "^BenchmarkSource$"}}'
      BENCHTIME: '{{.BENCHTIME | default "3s"}}'
      NODES: '{{.NODES | default 20}}'
    cmds:
      - mkdir -p {{.BENCH_DIR}}
      - >-
        go test -run='^$' -bench='{{.BENCH}}' -benchtime={{.BENCHTIME}}
        -cpuprofile={{.BENCH_DIR}}/cpu.out -memprofile={{.BENCH_DIR}}/mem.out
        -o {{.BENCH_DIR}}/profile.test {{.PKG}}
      - go tool pprof -top -nodecount={{.NODES}} {{.BENCH_DIR}}/profile.test {{.BENCH_DIR}}/cpu.out
      - >-
        go tool pprof -top -nodecount={{.NODES}} -sample_index=alloc_space
        {{.BENCH_DIR}}/profile.test {{.BENCH_DIR}}/mem.out

  lint:
    desc: Run golangci-lint
    cmds:
      - "{{.GOLANGCI_LINT}} run ./..."

  fmt:
    desc: Format the code
    cmds:
      - "{{.GOLANGCI_LINT}} fmt ./..."

  deps:
    desc: Fail when the root module requires another module (product rule 8)
    cmds:
      - test "$(go list -m all)" = "$(go list -m)"

  ci:
    desc: Run the full CI suite
    cmds:
      - task: build
      - cmd: |
          rc=0
          task test || rc=1
          task lint || rc=1
          task deps || rc=1
          exit $rc

  release-check:
    desc: Validate the goreleaser config
    cmds:
      - "{{.GORELEASER}} check"

  release-snapshot:
    desc: Build a local snapshot release into dist/ (no tag, no publish)
    cmds:
      - "{{.GORELEASER}} release --snapshot --clean"

  warm-proxy:
    desc: Wait for proxy.golang.org to report the release tag
    silent: true
    cmds:
      - cmd: |
          set -eu
          module="$(go list -m)"
          tag="${GORELEASER_CURRENT_TAG:-$(git describe --tags --exact-match 2>/dev/null || true)}"
          if [ -z "$tag" ]; then
            echo "warm-proxy: not a tagged commit - skipping"
            exit 0
          fi
          echo "warm-proxy: waiting for proxy.golang.org to report $module@$tag"
          # The proxy can answer a new tag from its cached tags of the
          # repository and cache that miss for up to 30 minutes
          # (proxy.golang.org FAQ). A commit hash is never in that cache, so
          # asking for it first makes the proxy fetch the repository again. The
          # answer can name another tag of the same commit, so only the
          # version's own .info below decides.
          curl -fsS -o /dev/null "https://proxy.golang.org/$module/@v/$(git rev-list -n 1 "$tag").info" || true
          i=1
          while [ "$i" -le 70 ]; do
            # Asking for the version itself makes the proxy fetch it; @latest
            # never resolves to a prerelease.
            if curl -fsS -o /dev/null "https://proxy.golang.org/$module/@v/$tag.info" 2>/dev/null; then
              echo "warm-proxy: proxy reports $tag (attempt $i)"
              exit 0
            fi
            echo "warm-proxy: attempt $i/70 - $tag not on the proxy yet"
            if [ "$i" -lt 70 ]; then sleep 30; fi
            i=$((i + 1))
          done
          echo "warm-proxy: proxy.golang.org did not report $tag after 35 minutes" >&2
          exit 1

  release:
    desc: Build and publish a release (should run on a pushed tag in CI only)
    deps: [warm-proxy]
    cmds:
      - "{{.GORELEASER}} release --clean"
