version: 2

project_name: markfmt

report_sizes: true

before:
  hooks:
    - go mod verify

builds:
  - main: ./cmd/markfmt
    binary: markfmt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.revision={{ .Commit }}
      - -X main.date={{ .CommitDate }}

archives:
  - formats: [tar.gz]
    # No version in the name, so releases/latest/download links on
    # markfmt.com stay valid for every release.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: ""
  abbrev: -1
  groups:
    - title: Breaking changes
      regexp: '^\S*\s?[a-zA-Z]+(\(.+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))??:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??:.+$'
      order: 2
    - title: Documentation
      regexp: '^.*?docs(\(.+\))??:.+$'
      order: 3
    - title: Others
      order: 999

release:
  prerelease: auto

gomod:
  proxy: true

homebrew_casks:
  - name: markfmt
    repository:
      owner: strangemattersystems
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:strangemattersystems/homebrew-tap.git
        private_key: '{{ envOrDefault "HOMEBREW_TAP_DEPLOY_KEY" "" }}'
    directory: Casks
    homepage: https://markfmt.com
    description: A fast, zero-config formatter that rewrites Markdown into one canonical style
    license: MIT
    # A prerelease tag publishes no cask.
    skip_upload: auto
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binary is not notarized, so macOS would block it on its first run.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/markfmt"]
          end

# Requires syft on PATH (installed in CI).
sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum

docker_signs:
  - cmd: cosign
    args: ["sign", "${artifact}@${digest}", "--yes"]

dockers_v2:
  - images:
      - ghcr.io/strangemattersystems/markfmt
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.description: "A fast, zero-config formatter that rewrites Markdown into one canonical style"
      org.opencontainers.image.source: "https://github.com/strangemattersystems/markfmt"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: MIT
    annotations:
      org.opencontainers.image.description: "A fast, zero-config formatter that rewrites Markdown into one canonical style"
