name: Bench

on:
  pull_request:
    paths:
      - "**.go"
      - "go.mod"
      - "internal/**/testdata/**"
      - "Taskfile.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  bench:
    name: bench
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # bench-compare reads the base branch out of the checkout.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/go.sum
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # A shared runner is too noisy to gate a merge, so a slower head is a
      # table to read, never a failure.
      - name: Compare with the base branch
        continue-on-error: true
        run: task bench-compare BASE="origin/$GITHUB_BASE_REF"
      - name: Write the table to the job summary
        if: always()
        run: |
          {
            echo "## benchstat: $GITHUB_BASE_REF against this pull request"
            echo
            echo '```'
            cat .bench/compare.txt 2>/dev/null || echo 'bench-compare produced no table'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
