name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly:
    name: nightly
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: tools/go.sum
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - id: fuzz-cache-dir
        run: echo "path=$(go env GOCACHE)/fuzz" >>"$GITHUB_OUTPUT"
      # The corpus a run grows is the value of the next run, so it is restored
      # from the newest run of this workflow and saved under a new key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.fuzz-cache-dir.outputs.path }}
          key: fuzz-${{ runner.os }}-${{ github.run_id }}
          restore-keys: fuzz-${{ runner.os }}-
      - run: task long
      - name: Fuzz the parser, the comparison and the formatter
        run: |
          task fuzz FUZZ=FuzzParse -- -fuzztime=10m
          task fuzz FUZZ=FuzzEqual -- -fuzztime=10m
          task fuzz FUZZ=FuzzSource -- -fuzztime=10m
      # FuzzFormat fails on a block that the printer cannot write and Source
      # keeps as written, and some are open, so its findings are a report.
      - name: Fuzz the formatter
        id: fuzz-format
        continue-on-error: true
        run: task fuzz FUZZ=FuzzFormat -- -fuzztime=10m
      - if: failure() || steps.fuzz-format.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-findings
          path: internal/markdown/testdata/fuzz/**
          if-no-files-found: ignore
